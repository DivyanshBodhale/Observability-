name: Docker Build & Push

on:

  workflow_run:

    workflows:
      - Continuous Integration

    branches:
      - master

    types:
      - completed

jobs:

  docker:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKER_USERNAME }}

          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend

        run: |

          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest \
          ./frontend

      - name: Build Backend

        run: |

          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/notes-backend:latest \
          ./backend

      - name: Trivy Scan Frontend

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest

      - name: Trivy Scan Backend

        uses: aquasecurity/trivy-action@master

        with:

          image-ref: ${{ secrets.DOCKER_USERNAME }}/notes-backend:latest

      - name: Push Frontend

        run: docker push ${{ secrets.DOCKER_USERNAME }}/notes-frontend:latest

      - name: Push Backend

        run: docker push ${{ secrets.DOCKER_USERNAME }}/notes-backend:latest
